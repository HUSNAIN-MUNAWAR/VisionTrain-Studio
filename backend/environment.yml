name: visiontrain
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - fastapi
      - uvicorn[standard]
      - python-multipart
      - pydantic
      - ultralytics
      - torch
      - torchvision
      - timm
      - opencv-python
      - pillow
      - numpy
      - pandas
      - pyyaml
      - psutil
      - tqdm
      - scikit-learn
      - onnx
      - onnxruntime
